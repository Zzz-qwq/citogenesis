<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>乌合之帖 · Citogenesis</title>
<meta http-equiv="refresh" content="0; url=./game/" />
<link rel="canonical" href="./game/" />
<style>
  :root{ --bg:#F4F3EF; --ink:#2B2B28; --ink2:#5A5A55; --line:#DDDAD2; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);
       font-family:"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;
       display:flex;align-items:center;justify-content:center;text-align:center;padding:24px}
  .box{max-width:420px}
  h1{font-size:22px;font-weight:600;letter-spacing:.04em;margin-bottom:14px}
  p{color:var(--ink2);font-size:14px;line-height:1.9}
  a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line);
    padding-bottom:2px;transition:border-color .2s}
  a:hover{border-color:var(--ink)}
</style>
</head>
<body>
  <div class="box">
    <h1>乌合之帖 · Citogenesis</h1>
    <p>正在进入游戏……<br />如果没有自动跳转，请点 <a href="./game/">这里</a>。</p>
  </div>
  <script>location.replace('./game/');</script>
</body>
</html>
